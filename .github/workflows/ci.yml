name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (check:ci)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_sales
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_sales"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ai_sales
      REDIS_URL: redis://localhost:6379
      S3_BUCKET: ai-sales-assets
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: eu-west-3
      BETTER_AUTH_SECRET: local-better-auth-secret-min-32-chars-long!
      BETTER_AUTH_URL: http://localhost:4000
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      META_GRAPH_VERSION: v23.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 11.17 (standalone)
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          standalone: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CI env files
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env
          cp .env.example apps/web/.env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Enable pgvector extension
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=password psql -h localhost -U postgres -d ai_sales -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Push database schema
        run: pnpm db:push

      - name: Build shared package declarations
        run: pnpm --filter @app/shared build

      - name: Run check:ci (lint, format, types, tests, build)
        run: pnpm check:ci

  playwright-verify:
    name: Playwright Setup Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 11.17 (standalone)
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          standalone: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

  security-scan:
    name: Vulnerability Scan (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 11.17 (standalone)
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          standalone: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Run vulnerability audit (NFR-SEC-08)
        run: pnpm audit --audit-level=high

name: ai-sales-manager

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-sales-postgres
    environment:
      POSTGRES_DB: ai_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sales"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-sales-network

  redis:
    image: redis:7-alpine
    container_name: ai-sales-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-sales-network

  minio:
    image: minio/minio:latest
    container_name: ai-sales-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-sales-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-sales-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ai_sales
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ai-sales-assets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      BETTER_AUTH_SECRET: local-better-auth-secret-min-32-chars-long!
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
    healthcheck:
      # 13 §2.10 / 18 §6: /ready is 200 only when Postgres and Redis answer.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-sales-network

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-sales-worker
    command: ["node", "dist/worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ai_sales
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ai-sales-assets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      BETTER_AUTH_SECRET: local-better-auth-secret-min-32-chars-long!
      BETTER_AUTH_URL: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-sales-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-sales-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-sales-network

networks:
  ai-sales-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
